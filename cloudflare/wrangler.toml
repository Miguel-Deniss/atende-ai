# ============================================================================
# Cloudflare Workers + Pages Configuration
# ============================================================================
# Deploy: npx wrangler deploy
# Preview: npx wrangler dev
# ============================================================================

name = "atende-ai"
main = "src/cloudflare/worker.ts"
compatibility_date = "2025-04-01"

# ============================================================================
# Routes
# ============================================================================
routes = [
  { pattern = "app.atendeai.com/*", zone_id = "ZONE_ID_HERE" },
]

# ============================================================================
# Environment Variables
# ============================================================================
[vars]
NODE_VERSION = "20"
APP_URL = "https://app.atendeai.com"

# ============================================================================
# Secrets (set via: npx wrangler secret put <NAME>)
# ============================================================================
# DATABASE_URL
# JWT_SECRET
# STRIPE_SECRET_KEY
# OPENAI_API_KEY

# ============================================================================
# D1 Database (optional - for edge data)
# ============================================================================
# [[d1_databases]]
# binding = "DB"
# database_name = "atende-ai-db"
# database_id = "DATABASE_ID_HERE"

# ============================================================================
# R2 Bucket (optional - for edge storage)
# ============================================================================
# [[r2_buckets]]
# binding = "STORAGE"
# bucket_name = "atende-ai-uploads"

# ============================================================================
# KV Namespace (optional - for edge cache/sessions)
# ============================================================================
# [[kv_namespaces]]
# binding = "SESSION_KV"
# id = "KV_ID_HERE"
