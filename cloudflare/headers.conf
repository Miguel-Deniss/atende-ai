# ============================================================================
# Cloudflare Headers Configuration
# ============================================================================
# Apply these via Cloudflare Dashboard > Rules > Transform Rules
# Or via Cloudflare Workers (see worker.ts)
# ============================================================================

# --- Security Headers (applied to all responses) ---
X-Frame-Options: DENY
X-Content-Type-Options: nosniff
Referrer-Policy: strict-origin-when-cross-origin
X-XSS-Protection: "1; mode=block"
Strict-Transport-Security: "max-age=63072000; includeSubDomains; preload"
Permissions-Policy: "camera=(), microphone=(), geolocation=(), interest-cohort=()"
Cross-Origin-Resource-Policy: same-origin
Cross-Origin-Embedder-Policy: require-corp
Cross-Origin-Opener-Policy: same-origin

# --- Cache Rules ---

# Static assets: cache for 1 year on CDN and browser
# URL Pattern: /_next/static/*
Cache-Control: public, max-age=31536000, immutable
CDN-Cache-Control: public, max-age=31536000, immutable

# API responses: no cache
# URL Pattern: /api/*
Cache-Control: no-store, no-cache, must-revalidate
CDN-Cache-Control: no-store

# Health check: no cache
# URL Pattern: /api/health
Cache-Control: no-store, no-cache, must-revalidate

# Pages: short CDN cache
# URL Pattern: /
Cache-Control: public, max-age=0, must-revalidate
CDN-Cache-Control: public, max-age=60

# Static pages (privacy, terms): cache for 1 hour
# URL Pattern: /privacy, /terms
Cache-Control: public, max-age=3600

# Uploads directory: private per-company
# URL Pattern: /uploads/*
Cache-Control: private, max-age=3600
