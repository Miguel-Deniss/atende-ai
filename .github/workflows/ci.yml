name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/atendeai_test?schema=public"
  DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/atendeai_test?schema=public"
  JWT_SECRET: "ci-jwt-secret-for-testing-only"
  SESSION_SECRET: "ci-session-secret-for-testing-only"
  ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef"
  SIGNED_URL_SECRET: "ci-signed-url-secret-for-testing"
  APP_URL: "http://localhost:3000"

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atendeai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npx prisma validate
      - name: Rebuild an empty database from migrations
        run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  docker:
    name: Build container image
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: atendeai:${{ github.sha }}
