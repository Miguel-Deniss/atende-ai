name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        default: staging
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
  MIGRATOR_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}-migrate

jobs:
  image:
    name: Publish immutable images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ env.APP_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: ${{ env.MIGRATOR_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  staging:
    name: Deploy exact commit to staging
    needs: image
    if: github.event_name == 'push' || inputs.environment == 'staging'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.atendeai.com
    steps:
      - name: Migrate, replace, health gate and rollback
        uses: appleboy/ssh-action@v1.2.2
        env:
          APP_IMAGE: ${{ env.APP_IMAGE }}
          MIGRATOR_IMAGE: ${{ env.MIGRATOR_IMAGE }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: APP_IMAGE,MIGRATOR_IMAGE,GHCR_USER,GHCR_TOKEN
          script: /opt/atendeai/scripts/deploy-image.sh

  production:
    name: Deploy exact commit to production
    needs: image
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.atendeai.com
    steps:
      - name: Migrate, replace, health gate and rollback
        uses: appleboy/ssh-action@v1.2.2
        env:
          APP_IMAGE: ${{ env.APP_IMAGE }}
          MIGRATOR_IMAGE: ${{ env.MIGRATOR_IMAGE }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: APP_IMAGE,MIGRATOR_IMAGE,GHCR_USER,GHCR_TOKEN
          script: /opt/atendeai/scripts/deploy-image.sh
